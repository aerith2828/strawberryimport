[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strawberryimport"
version = "0.1.0"
description = "Import play counts from ListenBrainz or Last.fm into the Strawberry music player database"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
strawberryimport = "strawberryimport.cli:main"

[tool.setuptools]
packages = ["strawberryimport"]
